name: CI

permissions:
  contents: read
  checks: write

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typegen
      - run: pnpm typecheck
      - run: pnpm lint:check --format=github
      - run: pnpm format:check
      - run: pnpm test:ci
      - uses: mikepenz/action-junit-report@v6
        if: '!cancelled()'
        with:
          report_paths: junit.xml
      - run: pnpm build
